name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, lint and APK
        run: ./gradlew testAndroid10DebugUnitTest testAndroid8DebugUnitTest lintAndroid10Debug lintAndroid8Debug assembleAndroid10Release assembleAndroid8Release

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/android10/release/app-android10-release.apk "Chatty-1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/android8/release/app-android8-release.apk "Chatty-1.${{ github.run_number }}-android8.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: chatty-apk
          path: Chatty-1.${{ github.run_number }}*.apk

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chatty-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "💬 Chatty 1.${{ github.run_number }} — New APK"
          prerelease: false
          files: Chatty-1.${{ github.run_number }}*.apk
          body: |
            <p align="center">
              <img src="https://cdn.simpleicons.org/android/3DDC84" width="56" alt="Android">
              &nbsp;&nbsp;
              <img src="https://cdn.simpleicons.org/github/181717" width="56" alt="GitHub">
            </p>

            <h1 align="center">💬 Chatty — New APK</h1>

            <p align="center">
              <strong>A more stable Chatty is here.</strong><br>
              This release focuses on reliability, crash protection and a smoother messaging experience.
            </p>

            ---

            ## ✨ What's new

            - 🛡️ **Crash protection** — hardened several operations that could unexpectedly terminate the app.
            - 💬 **SMS & MMS** — safer handling of failed or interrupted operations.
            - 🖼️ **Media viewer** — improved protection around image decoding and external sharing.
            - ✨ **Screen effects** — removed a fragile graphics compositing path that could cause rendering crashes.
            - ⚡ **General stability** — additional safeguards around Android operations and lifecycle events.

            ## 📦 Downloads

            | APK | Android |
            | --- | --- |
            | `Chatty-1.${{ github.run_number }}.apk` | Android 10+ |
            | `Chatty-1.${{ github.run_number }}-android8.apk` | Android 8 / 9 |

            > **Tip:** Choose the APK matching your Android version.

            ## 🧪 Built & tested automatically

            This APK was generated by the Chatty Android CI.

            - ✅ Unit tests
            - ✅ Lint
            - ✅ Android 8 / 9 release build
            - ✅ Android 10+ release build

            <p align="center">
              <img src="https://cdn.simpleicons.org/kotlin/7F52FF" width="36" alt="Kotlin">
              &nbsp;
              <img src="https://cdn.simpleicons.org/githubactions/2088FF" width="36" alt="GitHub Actions">
            </p>

            <p align="center">
              <strong>Chatty — simple messaging, built with care. 💙</strong>
            </p>

            <hr>

            <p align="center">
              <sub>Build ${{ github.run_number }} · Commit ${{ github.sha }}</sub>
            </p>
