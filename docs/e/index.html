<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Message avec effet · Chatty</title>
<meta name="description" content="Touchez pour voir le message avec son effet, comme sur iMessage.">
<meta property="og:title" content="✨ Message envoyé avec un effet">
<meta property="og:description" content="Touchez pour voir l'animation · Chatty">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #0b0b12;
    --bubble: #3d5afe;
    --bubble-2: #6c3df4;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    font-weight: 600; font-size: 15px; color: var(--muted); position: relative; z-index: 3; }
  header .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3d5afe, #6c3df4);
    display: grid; place-items: center; color: #fff; font-size: 15px; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; position: relative; z-index: 2; }
  .row { display: flex; justify-content: flex-end; }
  .bubble { max-width: min(78vw, 420px); padding: 11px 16px; border-radius: 22px 22px 6px 22px; font-size: 18px; line-height: 1.35;
    background: linear-gradient(135deg, var(--bubble), var(--bubble-2)); color: var(--text); white-space: pre-wrap; word-wrap: break-word;
    transform-origin: 100% 100%; position: relative; box-shadow: 0 10px 30px -12px rgba(61, 90, 254, 0.7); }
  .meta { text-align: right; color: var(--muted); font-size: 12px; margin: 8px 6px 0; }
  footer { position: relative; z-index: 3; padding: 12px 16px max(18px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 600; font-size: 15px;
    color: #fff; background: rgba(255, 255, 255, 0.12); text-decoration: none; cursor: pointer; }
  .btn.primary { background: linear-gradient(135deg, #3d5afe, #6c3df4); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
  canvas.front { z-index: 4; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .picker { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .picker button { padding: 8px 12px; font-size: 14px; }
  .ink { filter: blur(9px); }
  .ink-cover { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }

  @keyframes slam { 0% { transform: translateY(-160px) scale(3.2); opacity: 0; } 18% { opacity: 1; }
    45% { transform: translateY(0) scale(0.9); } 60% { transform: scale(1.06); } 75% { transform: scale(0.98); } 100% { transform: scale(1); } }
  @keyframes shockwave { 0% { transform: scale(0.4); opacity: 0.6; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes loud { 0% { transform: scale(1); } 18% { transform: scale(1.9) rotate(-3deg); } 30% { transform: scale(1.75) rotate(3deg); }
    42% { transform: scale(1.9) rotate(-3deg); } 54% { transform: scale(1.75) rotate(2deg); } 66% { transform: scale(1.9); } 100% { transform: scale(1); } }
  @keyframes gentle { 0% { transform: scale(0.3); opacity: 0.15; } 45% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 10% { transform: translateX(-28px) rotate(-2deg); } 20% { transform: translateX(28px) rotate(2deg); }
    30% { transform: translateX(-24px); } 40% { transform: translateX(24px); } 50% { transform: translateX(-18px); } 60% { transform: translateX(18px); }
    70% { transform: translateX(-10px); } 80% { transform: translateX(10px); } 90% { transform: translateX(-4px); } }
  @keyframes jelly { 0% { transform: scale(0.2); } 30% { transform: scale(1.25, 0.8); } 45% { transform: scale(0.85, 1.15); }
    60% { transform: scale(1.08, 0.94); } 75% { transform: scale(0.97, 1.03); } 100% { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>
<canvas id="back"></canvas>
<header><div class="logo">💬</div><span>Chatty</span></header>
<main>
  <div class="row"><div class="bubble" id="bubble"></div></div>
  <div class="meta" id="meta"></div>
  <div class="hint" id="hint"></div>
  <div class="picker" id="picker"></div>
</main>
<footer>
  <button id="replay">↻ Rejouer</button>
  <a class="btn primary" href="https://github.com/furaxdev/chatty/releases/latest">Chatty pour Android</a>
</footer>
<canvas id="front" class="front"></canvas>
<script>
(() => {
  "use strict";

  // Effets Chatty (même ordre et mêmes noms que dans l'appli Android).
  const EFFECTS = {
    slam: { label: "Claquer", emoji: "💥", kind: "bubble" },
    loud: { label: "Fort", emoji: "📢", kind: "bubble" },
    gentle: { label: "Doux", emoji: "🪶", kind: "bubble" },
    invisible_ink: { label: "Encre invisible", emoji: "🫥", kind: "bubble" },
    shake: { label: "Secousse", emoji: "🫨", kind: "bubble" },
    jelly: { label: "Gelée", emoji: "🍮", kind: "bubble" },
    echo: { label: "Écho", emoji: "🔁", kind: "screen", dur: 3400 },
    spotlight: { label: "Projecteur", emoji: "🔦", kind: "screen", dur: 3400 },
    balloons: { label: "Ballons", emoji: "🎈", kind: "screen", dur: 3400 },
    confetti: { label: "Confettis", emoji: "🎊", kind: "screen", dur: 3400 },
    love: { label: "Amour", emoji: "❤️", kind: "screen", dur: 3400 },
    lasers: { label: "Lasers", emoji: "🪩", kind: "screen", dur: 4200 },
    fireworks: { label: "Feux d'artifice", emoji: "🎆", kind: "screen", dur: 4600 },
    celebration: { label: "Célébration", emoji: "✨", kind: "screen", dur: 3400 },
    snow: { label: "Neige", emoji: "❄️", kind: "screen", dur: 4200 },
    emoji_rain: { label: "Pluie d'emojis", emoji: "🤩", kind: "screen", dur: 3400 },
    rainbow: { label: "Arc-en-ciel", emoji: "🌈", kind: "screen", dur: 3400 },
    money: { label: "Pluie de billets", emoji: "💸", kind: "screen", dur: 3400 },
    shooting_stars: { label: "Étoiles filantes", emoji: "🌠", kind: "screen", dur: 3400 },
  };

  const FESTIVE = ["#ff5252", "#ffd740", "#69f0ae", "#40c4ff", "#e040fb", "#ff6e40", "#ffffff"];
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- lien : #effet.texteBase64url
  function decodeText(b64) {
    try {
      const s = b64.replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(s + "===".slice((s.length + 3) % 4));
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    } catch (e) { return ""; }
  }
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    const dot = raw.indexOf(".");
    const id = (dot < 0 ? raw : raw.slice(0, dot)).toLowerCase();
    const text = dot < 0 ? "" : decodeText(raw.slice(dot + 1));
    return { id, text };
  }

  // ---------------------------------------------------------------- canvas
  const back = document.getElementById("back");
  const front = document.getElementById("front");
  const bctx = back.getContext("2d");
  const fctx = front.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [back, front]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
      c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
    }
  }
  window.addEventListener("resize", resize);
  resize();

  // Générateur pseudo-aléatoire reproductible
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const fade = (t, a = 0.1, b = 0.8) => t < a ? t / a : t > b ? Math.max(0, (1 - t) / (1 - b)) : 1;
  const local = (t, d, span = 1 - d) => Math.min(1, Math.max(0, (t - d) / span));
  const fall = (l, k = 3) => (l - (1 - Math.exp(-k * l)) / k) / (1 - (1 - Math.exp(-k)) / k);
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const tgt = amt >= 0 ? 255 : 0, a = Math.abs(amt);
    r = Math.round(r + (tgt - r) * a); g = Math.round(g + (tgt - g) * a); b = Math.round(b + (tgt - b) * a);
    return `rgb(${r},${g},${b})`;
  }
  function glow(ctx, x, y, r, color, alpha) {
    if (alpha <= 0 || !(r > 0)) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${alpha})`);
    g.addColorStop(0.18, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function heartPath(ctx, cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.35);
    ctx.bezierCurveTo(cx - s * 1.1, cy - s * 0.3, cx - s * 0.5, cy - s * 1.0, cx, cy - s * 0.45);
    ctx.bezierCurveTo(cx + s * 0.5, cy - s * 1.0, cx + s * 1.1, cy - s * 0.3, cx, cy + s * 0.35);
    ctx.closePath();
  }
  function emojisOf(text) {
    const found = Array.from(text.matchAll(/\p{Extended_Pictographic}/gu), (m) => m[0]);
    return found.length ? [...new Set(found)] : ["🎉", "😄", "✨"];
  }

  // ---------------------------------------------------------------- effets plein écran
  // Chaque effet : setup(rand) -> draw(t, ctxBack, ctxFront)
  const SCREEN = {
    confetti(r) {
      const p = Array.from({ length: 180 }, () => {
        const depth = r();
        return { x0: r() * W, y0: -40 - r() * H * 0.35, d: r() * 0.3, sp: 0.75 + depth * 0.7, sw: 15 + r() * 55,
          sf: 5 + r() * 6, ph: r() * TAU, dr: (r() - 0.5) * 120, c: FESTIVE[Math.floor(r() * FESTIVE.length)],
          shape: Math.floor(r() * 3), spin: (r() - 0.5) * 16, flip: 2 + r() * 5, depth };
      });
      return (t, b, f) => {
        for (const q of p) {
          const l = local(t, q.d); if (l <= 0) continue;
          const y = q.y0 + fall(l, 2.5) * q.sp * (H + 200 - q.y0);
          const x = q.x0 + Math.sin(l * q.sf + q.ph) * q.sw + q.dr * l;
          const s = 0.6 + q.depth * 0.7;
          const flipA = l * q.flip * TAU;
          f.save(); f.translate(x, y); f.rotate(q.spin * l);
          f.scale(1, Math.cos(flipA));
          f.globalAlpha = fade(t, 0.02, 0.88) * (0.55 + 0.45 * Math.abs(Math.cos(flipA))) * (0.6 + 0.4 * q.depth);
          f.fillStyle = q.c;
          if (q.shape === 2) { f.beginPath(); f.arc(0, 0, 5 * s, 0, TAU); f.fill(); }
          else if (q.shape === 1) f.fillRect(-12 * s, -2.5 * s, 24 * s, 5 * s);
          else f.fillRect(-8 * s, -4.5 * s, 16 * s, 9 * s);
          f.restore();
        }
      };
    },

    balloons(r) {
      const p = Array.from({ length: 14 }, (_, i) => ({ x0: r() * W, d: r() * 0.3, rad: 45 + r() * 35,
        c: FESTIVE[Math.floor(r() * (FESTIVE.length - 1))], i, sp: 0.85 + r() * 0.3, bob: 2.5 + r() * 2, tilt: 4 + r() * 6 }))
        .sort((a, b) => a.rad - b.rad);
      return (t, b, f) => {
        for (const q of p) {
          const l = local(t, q.d); if (l <= 0) continue;
          const rad = q.rad * Math.min(1, W / 420);
          const rise = l * l * (3 - 2 * l) * 0.35 + l * 0.65;
          const y = H + rad * 2 - rise * q.sp * (H + rad * 6) - Math.sin(l * TAU * q.bob) * 6;
          const x = q.x0 + Math.sin(l * 6 + q.i) * 30;
          f.save(); f.translate(x, y); f.rotate((Math.sin(l * TAU * 1.2 + q.i) * q.tilt) * Math.PI / 180);
          // ficelle
          f.strokeStyle = "rgba(200,200,200,0.8)"; f.lineWidth = 1.5;
          f.beginPath(); f.moveTo(0, rad * 1.15);
          f.bezierCurveTo(-12, rad * 1.8 + Math.sin(l * 10) * 6, 10, rad * 2.2, 4, rad * 2.8); f.stroke();
          // nœud
          f.fillStyle = shade(q.c, -0.25);
          f.beginPath(); f.moveTo(0, rad * 1.1); f.lineTo(-7, rad * 1.3); f.lineTo(7, rad * 1.3); f.closePath(); f.fill();
          // enveloppe en volume
          const g = f.createRadialGradient(-rad * 0.35, -rad * 0.45, rad * 0.1, 0, 0, rad * 1.4);
          g.addColorStop(0, shade(q.c, 0.45)); g.addColorStop(0.45, q.c); g.addColorStop(1, shade(q.c, -0.4));
          f.fillStyle = g;
          f.beginPath(); f.ellipse(0, 0, rad, rad * 1.15, 0, 0, TAU); f.fill();
          // reflet
          f.fillStyle = "rgba(255,255,255,0.45)";
          f.beginPath(); f.ellipse(-rad * 0.4, -rad * 0.45, rad * 0.18, rad * 0.32, -0.4, 0, TAU); f.fill();
          f.restore();
        }
      };
    },

    love(r) {
      const sparks = Array.from({ length: 18 }, () => [r() * TAU, 0.5 + r() * 0.4]);
      const floats = Array.from({ length: 26 }, () => ({ x0: W * (0.1 + r() * 0.8), d: r() * 0.55, s: 12 + r() * 18,
        sw: 20 + r() * 40, ph: r() * TAU, c: ["#ff4d6d", "#ff80ab", "#e91e63", "#ffb3c6"][Math.floor(r() * 4)], sp: 0.6 + r() * 0.5 }));
      const beat = (t) => { const ph = (t * 4) % 1; const pulse = (x) => Math.exp(-(x * x) / 0.0025);
        return 1 + 0.12 * pulse(ph - 0.1) + 0.07 * pulse(ph - 0.28); };
      return (t, b, f) => {
        const cx = W / 2, cy = H / 2, m = Math.min(W, H);
        const a = fade(t, 0.05, 0.8);
        const appear = Math.min(1, t / 0.25);
        const s = appear * (1 + 0.18 * Math.sin(appear * Math.PI) * (1 - appear)) * beat(t);
        // halo
        const hg = b.createRadialGradient(cx, cy, 0, cx, cy, m * 0.55 * s);
        hg.addColorStop(0, `rgba(255,77,109,${0.45 * a})`); hg.addColorStop(1, "rgba(255,77,109,0)");
        b.fillStyle = hg; b.fillRect(0, 0, W, H);
        // petits cœurs qui montent
        for (const q of floats) {
          const l = local(t, q.d, 0.45); if (l <= 0 || l >= 1) continue;
          b.save(); b.globalAlpha = (1 - l) * a;
          b.translate(q.x0 + Math.sin(l * 6 + q.ph) * q.sw, H * (0.95 - l * q.sp));
          b.rotate(Math.sin(l * 5 + q.ph) * 0.26); b.scale(Math.min(1, l / 0.15), Math.min(1, l / 0.15));
          heartPath(b, 0, 0, q.s); b.fillStyle = q.c; b.fill(); b.restore();
        }
        // grand cœur
        const hs = m * 0.28 * s;
        b.save(); b.globalAlpha = a;
        const gg = b.createLinearGradient(cx, cy - hs, cx, cy + hs);
        gg.addColorStop(0, "#ff6b86"); gg.addColorStop(1, "#d81b47");
        heartPath(b, cx, cy + hs * 0.2, hs); b.fillStyle = gg; b.fill();
        b.fillStyle = "rgba(255,255,255,0.35)";
        b.beginPath(); b.ellipse(cx - hs * 0.42, cy - hs * 0.32, hs * 0.16, hs * 0.09, -0.6, 0, TAU); b.fill();
        b.restore();
        // 💕 qui jaillissent
        f.save(); f.globalAlpha = a; f.font = "22px serif"; f.textAlign = "center"; f.textBaseline = "middle";
        const ease = 1 - (1 - t) * (1 - t);
        for (const [ang, df] of sparks) {
          const d = ease * m * df;
          f.fillText("💕", cx + Math.cos(ang) * d, cy + Math.sin(ang) * d - t * t * 60);
        }
        f.restore();
      };
    },

    fireworks(r) {
      // dessiné derrière la bulle, comme sur iMessage
      const fw = Array.from({ length: 7 }, (_, i) => ({ st: i * 0.1 + r() * 0.04, cx: W * (0.15 + r() * 0.7), cy: H * (0.12 + r() * 0.4),
        c: FESTIVE[Math.floor(r() * (FESTIVE.length - 1))], c2: FESTIVE[Math.floor(r() * FESTIVE.length)], size: Math.min(W, H) * (0.24 + r() * 0.12),
        sparks: Array.from({ length: 48 }, (_, s) => ({ a: s * TAU / 48 + (r() - 0.5) * 0.12, sp: 0.75 + r() * 0.3, tw: r() * TAU, acc: r() < 0.25 })) }));
      const rocket = 0.12, burst = 0.32;
      return (t, b, f) => {
        f = b;
        const sky = b.createLinearGradient(0, 0, 0, H);
        const a = 0.82 * fade(t, 0.06, 0.88);
        sky.addColorStop(0, `rgba(0,8,20,${a})`); sky.addColorStop(0.6, `rgba(20,0,46,${a})`); sky.addColorStop(1, `rgba(0,0,0,${a})`);
        b.fillStyle = sky; b.fillRect(0, 0, W, H);
        f.globalCompositeOperation = "lighter";
        for (const q of fw) {
          const kr = (t - q.st) / rocket;
          if (kr >= 0 && kr <= 1) {
            for (let tr = 0; tr < 6; tr++) {
              const k = kr - tr * 0.05; if (k < 0) continue;
              const e = 1 - (1 - k) * (1 - k);
              glow(f, q.cx + Math.sin(k * 9) * 3, H - (H - q.cy) * e, tr === 0 ? 9 : 6 - tr * 0.6, "rgba(255,224,130,1)", 1 - tr * 0.15);
            }
          }
          const k = (t - q.st - rocket) / burst;
          if (k < 0 || k > 1) continue;
          if (k < 0.35) glow(b, q.cx, q.cy, q.size * 1.5, hexA(q.c, 0.5), 0.45 * (1 - k / 0.35));
          for (const s of q.sparks) {
            const travel = (1 - Math.exp(-4 * k)) / (1 - Math.exp(-4)) * q.size * s.sp;
            const x = q.cx + Math.cos(s.a) * travel, y = q.cy + Math.sin(s.a) * travel + k * k * 110;
            const sparkle = k > 0.55 ? 0.55 + 0.45 * Math.sin(k * 60 + s.tw) : 1;
            const al = Math.max(0, Math.pow(1 - k, 1.3) * sparkle);
            glow(f, x, y, 14 * (1 - k * 0.45), s.acc ? q.c2 : q.c, al);
            f.globalAlpha = al; f.fillStyle = s.acc ? q.c2 : q.c;
            f.beginPath(); f.arc(x, y, 2.6 * (1 - k * 0.4), 0, TAU); f.fill(); f.globalAlpha = 1;
          }
        }
        f.globalCompositeOperation = "source-over";
      };
    },

    lasers(r) {
      // dessiné derrière la bulle, comme sur iMessage
      const cols = ["#00e5ff", "#ff1744", "#76ff03", "#e040fb"];
      const ph = Array.from({ length: 12 }, () => r() * TAU);
      return (t, b, f) => {
        f = b;
        const a = fade(t, 0.08, 0.85);
        b.fillStyle = `rgba(0,0,0,${0.85 * a})`; b.fillRect(0, 0, W, H);
        const ox = W / 2, oy = H * 0.45, len = Math.max(W, H) * 1.3;
        f.globalCompositeOperation = "lighter";
        cols.forEach((c, i) => {
          const ang = t * 3 + i * TAU / 4;
          glow(f, ox + Math.cos(ang) * W * 0.25, oy + Math.sin(ang) * H * 0.2, Math.max(W, H) * 0.5, hexA(c, 0.35), (0.18 + 0.12 * Math.sin(t * 30 + i)) * a);
        });
        for (let i = 0; i < 12; i++) {
          const c = cols[i % 4];
          const ang = (t * 6 + i * TAU / 12) % TAU + Math.sin(t * 9 + ph[i]) * 0.25;
          const strobe = (0.7 + 0.3 * Math.sin(t * 80 + ph[i])) * a;
          f.save(); f.translate(ox, oy); f.rotate(ang);
          const g = f.createLinearGradient(0, -15, 0, 15);
          g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.3, hexA(c, 0.35)); g.addColorStop(0.45, c);
          g.addColorStop(0.5, "#ffffff"); g.addColorStop(0.55, c); g.addColorStop(0.7, hexA(c, 0.35)); g.addColorStop(1, "rgba(0,0,0,0)");
          f.globalAlpha = strobe; f.fillStyle = g; f.fillRect(0, -15, len, 30);
          f.restore();
        }
        glow(f, ox, oy, 110 * (1 + 0.1 * Math.sin(t * 40)), "rgba(179,136,255,1)", a);
        f.globalCompositeOperation = "source-over";
      };
    },

    celebration(r) {
      // dessiné derrière la bulle, comme sur iMessage
      const m = Math.max(W, H);
      const p = Array.from({ length: 150 }, (_, i) => ({ d: r() * 0.5, a: Math.PI / 2 + r() * Math.PI / 2, sp: m * (0.4 + r() * 0.8), rad: 6 + r() * 6, i, star: r() < 0.66 }));
      const gold = ["#ffd54f", "#fff59d", "#ffb300"];
      return (t, b, f) => {
        f = b;
        const a = fade(t, 0.05, 0.8);
        b.fillStyle = `rgba(0,0,0,${0.4 * a})`; b.fillRect(0, 0, W, H);
        glow(b, W, 0, m * 0.55, "rgba(255,213,79,0.55)", 0.6 * a);
        f.globalCompositeOperation = "lighter";
        for (const q of p) {
          const l = local(t, q.d, 0.5); if (l <= 0 || l >= 1) continue;
          const tr = (1 - Math.exp(-3 * l)) / (1 - Math.exp(-3)) * q.sp;
          const x = W + Math.cos(q.a) * tr, y = Math.sin(q.a) * tr + l * l * 320;
          const al = (1 - l) * (0.45 + 0.55 * Math.abs(Math.sin(l * 40 + q.i)));
          const c = gold[q.i % 3];
          if (q.star) {
            f.save(); f.translate(x, y); f.rotate(l * Math.PI * (q.i % 2 ? -1 : 1)); f.globalAlpha = al;
            glow(f, 0, 0, q.rad * 1.6, hexA("#ffe082", 0.7), al);
            f.fillStyle = c; f.beginPath();
            const R = q.rad;
            f.moveTo(0, -R); f.lineTo(R * 0.25, -R * 0.25); f.lineTo(R, 0); f.lineTo(R * 0.25, R * 0.25);
            f.lineTo(0, R); f.lineTo(-R * 0.25, R * 0.25); f.lineTo(-R, 0); f.lineTo(-R * 0.25, -R * 0.25); f.closePath(); f.fill();
            f.restore();
          } else glow(f, x, y, q.rad * 1.5, c, al);
        }
        f.globalCompositeOperation = "source-over";
      };
    },

    spotlight(r) {
      const dust = Array.from({ length: 18 }, () => [r(), r(), r()]);
      return (t, b, f) => {
        const a = fade(t, 0.1, 0.8);
        const settle = Math.min(1, t / 0.4), e = settle * settle * (3 - 2 * settle);
        const bub = document.getElementById("bubble").getBoundingClientRect();
        const tx = bub.left + bub.width / 2, ty = bub.top + bub.height / 2;
        const sx = W * (0.2 + 0.5 * Math.sin(t * 8)), sy = H * 0.4;
        const cx = sx + (tx - sx) * e, cy = sy + (ty - sy) * e;
        const R = Math.max(160, bub.width * 0.75);
        const g = f.createRadialGradient(cx, cy, 0, cx, cy, R);
        g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, "rgba(0,0,0,0)");
        g.addColorStop(0.8, `rgba(0,0,0,${0.75 * a})`); g.addColorStop(1, `rgba(0,0,0,${0.9 * a})`);
        f.fillStyle = g; f.fillRect(0, 0, W, H);
        const w = f.createRadialGradient(cx, cy, 0, cx, cy, R);
        w.addColorStop(0, `rgba(255,248,225,${0.16 * a})`); w.addColorStop(1, "rgba(255,248,225,0)");
        f.fillStyle = w; f.fillRect(0, 0, W, H);
        dust.forEach(([p, d, s], i) => {
          const ang = p * TAU + t * (0.6 + s), dist = d * R * 0.45;
          glow(f, cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist - t * 30 * (i % 3), 2 + s * 3, "rgba(255,255,255,1)", a * (0.3 + 0.5 * s));
        });
      };
    },

    echo(r, text) {
      const label = (text || "👋").slice(0, 40);
      const p = Array.from({ length: 26 }, () => ({ d: r() * 0.6, y: H * r(), left: r() < 0.5, c: FESTIVE[Math.floor(r() * (FESTIVE.length - 1))], z: r(), dr: (r() - 0.5) * 80 }))
        .sort((x, y) => x.z - y.z);
      return (t, b, f) => {
        f.textBaseline = "top";
        for (const q of p) {
          const span = 0.55 - q.z * 0.2;
          const l = local(t, q.d, span); if (l <= 0 || l >= 1) continue;
          const x = q.left ? -300 + l * (W + 400) : W + 100 - l * (W + 400);
          const pop = Math.min(1, l / 0.12);
          f.save(); f.translate(x, q.y + q.dr * l); f.scale(pop, pop);
          f.globalAlpha = (0.35 + 0.6 * q.z) * (1 - Math.min(1, Math.max(0, (l - 0.85) / 0.15)));
          f.font = `600 ${13 + q.z * 18}px -apple-system, Roboto, sans-serif`;
          f.fillStyle = q.c; f.fillText(label, 0, 0); f.restore();
        }
      };
    },

    snow(r) {
      const p = Array.from({ length: 170 }, (_, i) => { const z = r(); return { x0: r() * W, sp: 0.25 + z * 0.75, rad: 1.5 + z * 5.5, off: r(), i, z, sw: 8 + z * 22 }; })
        .sort((a, b) => a.z - b.z);
      return (t, b, f) => {
        const a = fade(t, 0.1, 0.85);
        const g = b.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, `rgba(13,27,42,${0.5 * a})`); g.addColorStop(0.6, `rgba(27,38,59,${0.3 * a})`); g.addColorStop(1, "rgba(0,0,0,0)");
        b.fillStyle = g; b.fillRect(0, 0, W, H);
        for (const q of p) {
          const y = ((q.off + t * q.sp) % 1) * (H + 40) - 20;
          const x = q.x0 + Math.sin(t * 8 + q.i) * q.sw + Math.sin(t * 3) * 40 * q.z;
          const al = a * (0.45 + 0.5 * q.z);
          const sg = f.createRadialGradient(x, y, 0, x, y, q.rad * 1.4);
          sg.addColorStop(0, `rgba(255,255,255,${al})`); sg.addColorStop(0.55, `rgba(255,255,255,${al * 0.8})`); sg.addColorStop(1, "rgba(255,255,255,0)");
          f.fillStyle = sg; f.beginPath(); f.arc(x, y, q.rad * 1.4, 0, TAU); f.fill();
        }
      };
    },

    emoji_rain(r, text) {
      const em = emojisOf(text || "");
      const p = Array.from({ length: 60 }, (_, i) => ({ x: r() * W, d: r() * 0.4, sp: 0.7 + r() * 0.7, e: em[Math.floor(r() * em.length)], sz: 22 + Math.floor(r() * 20), i, tb: (r() - 0.5) * 2 }))
        .sort((a, b) => a.sz - b.sz);
      return (t, b, f) => {
        f.textAlign = "center"; f.textBaseline = "middle";
        for (const q of p) {
          const l = local(t, q.d); if (l <= 0) continue;
          f.save();
          f.translate(q.x + Math.sin(l * 4 + q.i) * 25, -80 + fall(l, 2) * q.sp * (H + 160));
          f.rotate((Math.sin(l * 6 + q.i) * 25 + q.tb * l * 90) * Math.PI / 180);
          f.scale(Math.cos(Math.sin(l * 5 + q.i) * 0.6), 1);
          f.globalAlpha = fade(t, 0.02, 0.85) * (0.7 + 0.3 * (q.sz - 22) / 20);
          f.font = `${q.sz * 1.3}px serif`; f.fillText(q.e, 0, 0); f.restore();
        }
      };
    },

    rainbow() {
      const cols = ["#ff1744", "#ff9100", "#ffea00", "#00e676", "#2979ff", "#651fff", "#d500f9"];
      return (t, b, f) => {
        const a = fade(t, 0.12, 0.75);
        const g0 = Math.min(1, t / 0.4), grow = 1 - (1 - g0) * (1 - g0);
        const m = Math.min(W, H), band = m * 0.05;
        const cx = W / 2, cy = H * 0.75;
        const outer = (Math.min(m * 0.75, W * 0.44) + band / 2) * grow;
        if (outer > band) {
          const inner = Math.max(0, outer - cols.length * band - band / 2);
          const g = f.createRadialGradient(cx, cy, inner, cx, cy, outer);
          g.addColorStop(0, "rgba(0,0,0,0)");
          [...cols].reverse().forEach((c, i) => g.addColorStop(Math.min(1, (band * (i + 1)) / (outer - inner)), hexA(c, 0.8)));
          g.addColorStop(1, "rgba(0,0,0,0)");
          f.save(); f.globalAlpha = a * (0.85 + 0.15 * Math.sin(t * 12));
          f.beginPath(); f.arc(cx, cy, outer, Math.PI, 0); f.arc(cx, cy, inner, 0, Math.PI, true); f.closePath();
          f.fillStyle = g; f.fill(); f.restore();
        }
        const cloudX = Math.min(m * 0.75, W * 0.44) - band * 3.5;
        [cx - cloudX, cx + cloudX].forEach((x, side) => {
          [[0, 0, 40], [-38, 10, 30], [38, 10, 30], [-18, -18, 28], [20, -14, 26]].forEach(([dx, dy, base]) => {
            const rad = base * grow; if (rad <= 0) return;
            const px = x + dx + Math.sin(t * 3 + side) * 8, py = cy + dy;
            const cg = f.createRadialGradient(px - rad * 0.2, py - rad * 0.3, rad * 0.1, px, py, rad * 1.1);
            cg.addColorStop(0, "#ffffff"); cg.addColorStop(0.7, "#f2f4f8"); cg.addColorStop(1, "#d5dae3");
            f.globalAlpha = a; f.fillStyle = cg; f.beginPath(); f.arc(px, py, rad, 0, TAU); f.fill(); f.globalAlpha = 1;
          });
        });
      };
    },

    money(r) {
      const p = Array.from({ length: 45 }, (_, i) => ({ x0: r() * W, d: r() * 0.45, sp: 0.6 + r() * 0.5, coin: r() < 0.25, i, fl: 2 + r() * 3 }));
      return (t, b, f) => {
        f.textAlign = "center"; f.textBaseline = "middle"; f.font = "34px serif";
        for (const q of p) {
          const l = local(t, q.d); if (l <= 0) continue;
          f.save(); f.globalAlpha = fade(t, 0.02, 0.85);
          if (q.coin) {
            f.translate(q.x0 + Math.sin(l * 3 + q.i) * 15, -60 + fall(l, 1.2) * (H + 120) * q.sp * 1.15);
            f.scale(Math.cos(l * 6 * Math.PI), 1);
            f.fillText("🪙", 0, 0);
          } else {
            f.translate(q.x0 + Math.sin(l * 9 + q.i) * 50, -60 + fall(l, 4) * (H + 120) * q.sp);
            f.rotate(Math.sin(l * 8 + q.i) * 0.7);
            f.scale(1, Math.cos(Math.sin(l * q.fl * TAU) * 0.95));
            f.fillText("💵", 0, 0);
          }
          f.restore();
        }
      };
    },

    shooting_stars(r) {
      // dessiné derrière la bulle, comme sur iMessage
      const stars = Array.from({ length: 120 }, (_, i) => ({ x: r() * W, y: r() * H, rad: 1.2 + r() * 1.5, i, c: ["#ffffff", "#cfe8ff", "#fff4d6"][Math.floor(r() * 3)], sp: 8 + r() * 20 }));
      const comets = Array.from({ length: 8 }, () => ({ st: r() * 0.62, x: W * (0.3 + r() * 0.9), y: H * r() * 0.4, span: 0.25 + r() * 0.1 }));
      return (t, b, f) => {
        f = b;
        const a = fade(t, 0.08, 0.85);
        const sky = b.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, `rgba(5,8,22,${0.88 * a})`); sky.addColorStop(0.5, `rgba(11,16,38,${0.85 * a})`); sky.addColorStop(1, `rgba(26,16,64,${0.85 * a})`);
        b.fillStyle = sky; b.fillRect(0, 0, W, H);
        for (const s of stars) glow(b, s.x, s.y, s.rad * 2.5, s.c, a * Math.max(0, Math.min(1, 0.4 + 0.6 * Math.sin(t * s.sp + s.i))));
        const dx = -1, dy = 0.55, n = Math.hypot(dx, dy), len = Math.max(W, H) * 0.6;
        for (const c of comets) {
          const l = (t - c.st) / c.span; if (l < 0 || l > 1) continue;
          const e = 1 - (1 - l) * (1 - l);
          const hx = c.x + dx * len * e, hy = c.y + dy * len * e;
          const tl = 260 * Math.max(0.15, Math.min(1, Math.sin(l * Math.PI) * 1.2));
          const tx = hx - dx / n * tl, ty = hy - dy / n * tl;
          const g = f.createLinearGradient(tx, ty, hx, hy);
          g.addColorStop(0, "rgba(207,232,255,0)"); g.addColorStop(0.7, `rgba(207,232,255,${0.6 * a})`); g.addColorStop(1, `rgba(255,255,255,${a})`);
          f.strokeStyle = g; f.lineWidth = 3; f.lineCap = "round";
          f.beginPath(); f.moveTo(tx, ty); f.lineTo(hx, hy); f.stroke();
          glow(f, hx, hy, 14, "rgba(207,232,255,1)", a * (1 - l * 0.5));
        }
      };
    },
  };

  function hexA(hex, a) {
    if (hex.startsWith("rgba") || hex.startsWith("rgb")) return hex;
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }

  // ---------------------------------------------------------------- lecture
  const bubble = document.getElementById("bubble");
  const meta = document.getElementById("meta");
  const hint = document.getElementById("hint");
  let raf = 0;
  let current = null;

  function stopScreen() {
    cancelAnimationFrame(raf);
    bctx.clearRect(0, 0, W, H);
    fctx.clearRect(0, 0, W, H);
  }

  function playBubble(id) {
    bubble.classList.remove("ink");
    bubble.style.animation = "none";
    void bubble.offsetWidth; // relance l'animation CSS
    const anims = { slam: "slam 0.9s cubic-bezier(.2,.8,.2,1)", loud: "loud 1.3s ease-in-out", gentle: "gentle 1.8s ease-out",
      shake: "shake 0.9s ease-in-out", jelly: "jelly 1.1s cubic-bezier(.3,1.6,.5,1)", invisible_ink: "pop 0.4s ease-out" };
    bubble.style.animation = anims[id] || "pop 0.4s ease-out";
    if (id === "invisible_ink") {
      bubble.classList.add("ink");
      hint.textContent = "Touchez la bulle pour révéler le message";
    }
    if (id === "slam") {
      // onde de choc sur l'écran
      const start = performance.now();
      const r = bubble.getBoundingClientRect();
      const step = (now) => {
        const k = (now - start) / 700;
        fctx.clearRect(0, 0, W, H);
        if (k > 0.35 && k < 1) {
          const kk = (k - 0.35) / 0.65;
          fctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - kk)})`; fctx.lineWidth = 3;
          fctx.beginPath(); fctx.ellipse(r.left + r.width / 2, r.top + r.height / 2, r.width * (0.5 + kk), r.height * (0.6 + kk * 1.5), 0, 0, TAU); fctx.stroke();
        }
        if (k < 1) raf = requestAnimationFrame(step); else fctx.clearRect(0, 0, W, H);
      };
      raf = requestAnimationFrame(step);
    }
  }

  function playScreen(id, text) {
    const fx = EFFECTS[id];
    const draw = SCREEN[id](rng(Date.now() & 0xffffffff), text);
    const start = performance.now();
    bubble.style.animation = "pop 0.4s ease-out";
    const step = (now) => {
      // L'horodatage de requestAnimationFrame peut précéder « start » d'une image.
      const t = Math.min(1, Math.max(0, (now - start) / fx.dur));
      bctx.clearRect(0, 0, W, H);
      fctx.clearRect(0, 0, W, H);
      draw(t, bctx, fctx);
      if (t < 1) raf = requestAnimationFrame(step); else stopScreen();
    };
    raf = requestAnimationFrame(step);
  }

  function play() {
    if (!current) return;
    stopScreen();
    hint.textContent = "";
    const fx = EFFECTS[current.id];
    if (fx.kind === "bubble") playBubble(current.id);
    else playScreen(current.id, current.text);
  }

  function show(id, text) {
    const fx = EFFECTS[id];
    current = { id, text };
    bubble.textContent = text || fx.emoji;
    meta.textContent = `Envoyé avec l'effet « ${fx.label} »`;
    document.title = `${fx.emoji} ${fx.label} · Chatty`;
    setTimeout(play, 350);
  }

  bubble.addEventListener("click", () => {
    if (bubble.classList.contains("ink")) { bubble.classList.remove("ink"); hint.textContent = ""; }
  });
  document.getElementById("replay").addEventListener("click", play);

  const { id, text } = parseHash();
  if (EFFECTS[id]) {
    show(id, text);
  } else {
    // Pas d'effet dans le lien : vitrine de tous les effets.
    bubble.textContent = "Choisissez un effet 👇";
    meta.textContent = "Les effets de Chatty, comme sur iMessage";
    const picker = document.getElementById("picker");
    picker.style.display = "flex";
    for (const [key, fx] of Object.entries(EFFECTS)) {
      const btn = document.createElement("button");
      btn.textContent = `${fx.emoji} ${fx.label}`;
      btn.addEventListener("click", () => show(key, "Coucou de Chatty !"));
      picker.appendChild(btn);
    }
  }
  window.addEventListener("hashchange", () => { const h = parseHash(); if (EFFECTS[h.id]) show(h.id, h.text); });
})();
</script>
</body>
